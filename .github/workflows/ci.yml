# Continuous integration for LoomTerminal.
# GitHub Actions sets CI=true, which turns warnings into errors (see Directory.Build.props).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LoomTerminal.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build LoomTerminal.slnx -c Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test --solution LoomTerminal.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/test-results/**/*.cobertura.xml

  aot-smoke-test:
    name: Native AOT publish (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Any trimming/AOT warning (IL2xxx, IL3xxx) fails the build: CI=true enables TreatWarningsAsErrors,
      # and the log is also scanned in case a tool reports warnings without honoring that setting.
      - name: Publish the samples with PublishAot
        shell: pwsh
        run: |
          foreach ($sample in 'LoomTerminal.Gallery', 'LoomTerminal.PtyConsole') {
            dotnet publish samples/$sample -c Release -r ${{ matrix.rid }} -warnaserror 2>&1 | Tee-Object -FilePath "publish-$sample.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $warnings = Select-String -Path "publish-$sample.log" -Pattern 'warning (IL|AOT|CS|CA|NETSDK)\d+'
            if ($warnings) { $warnings; throw "The AOT publish of $sample produced warnings." }
          }

      - name: Check the published gallery contains its XAML resources
        shell: pwsh
        run: |
          $publish = 'samples/LoomTerminal.Gallery/bin/Release/net11.0-windows10.0.26100.0/${{ matrix.rid }}/publish'
          foreach ($file in 'LoomTerminal.Gallery.exe', 'LoomTerminal.Gallery.pri') {
            if (-not (Test-Path (Join-Path $publish $file))) { throw "Missing $file in $publish" }
          }

      - name: Start the gallery (x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./eng/Test-AotApp.ps1 samples/LoomTerminal.Gallery -NoPublish

      - name: Run a command through the AOT pty harness (x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = 'samples/LoomTerminal.PtyConsole/bin/Release/net11.0/win-x64/publish/LoomTerminal.PtyConsole.exe'
          $output = & $exe cmd.exe /c echo loom-aot-ok
          if (-not ($output -match 'loom-aot-ok')) { $output; throw 'The AOT pty harness did not relay the output.' }

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.rid }}
          path: samples/LoomTerminal.Gallery/bin/Release/net11.0-windows10.0.26100.0/${{ matrix.rid }}/publish

  pack:
    name: Pack NuGet packages
    # Not on pull requests: the release workflow (dry run) packs and tests the packages.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Self-test the release scripts
        shell: pwsh
        run: |
          ./eng/Get-ReleaseVersion.ps1 -SelfTest
          ./eng/Get-ReleaseNotes.ps1 -SelfTest

      # Packages are built but NOT published: publishing is a manual, reviewed step.
      - name: Pack and test the packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages
